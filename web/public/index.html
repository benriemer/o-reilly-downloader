<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0d11" />
    <meta
      name="description"
      content="A private, local-first web interface for the O'Reilly downloader CLI."
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shelf</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/assets/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="app">
      <div class="boot-screen" aria-busy="true">
        <div class="boot-screen__mark">
          <svg width="48" height="48" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="#9be9c4" />
            <path d="M10 7.5h12v18l-6-4.2-6 4.2z" fill="#0a0d11" />
            <path d="M13 12h6" stroke="#9be9c4" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
        <p class="boot-screen__title">Shelf</p>
        <p class="boot-screen__hint">Opening your library…</p>
        <span class="spinner"></span>
      </div>
    </div>
    <div id="toasts" class="toasts" role="region" aria-label="Notifications" aria-live="polite"></div>
    <div id="modal-root"></div>
    <noscript>
      <div class="noscript">
        <h1>JavaScript is required</h1>
        <p>Shelf is a client-rendered interface. Enable JavaScript to use it.</p>
      </div>
    </noscript>
  </body>
</html>
